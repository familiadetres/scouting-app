'use strict';
/* RESUELVE V1.1 — Demo local. Ninguna solicitud sale de este navegador. */
const app = document.getElementById('app');
const templates = {
  home: document.getElementById('home-template'),
  how: document.getElementById('how-template'),
  new: document.getElementById('new-template'),
  track: document.getElementById('track-template'),
  admin: document.getElementById('admin-template')
};
const prices = {
  'CV y empleo': 'Desde 19 €',
  'Redes y carteles': 'Desde 15 €',
  'Dossier profesional': 'Desde 49 €',
  'Negocio': 'Desde 49 €',
  'Fútbol': 'Desde 25 €',
  'Otro': 'Presupuesto personalizado'
};
const statuses = ['Solicitud recibida', 'En preparación', 'Revisión', 'Listo para entregar', 'Entregado'];
const ORDERS_KEY = 'resuelve_orders';
const EMAIL_KEY = 'resuelve_last_email';
const store = (() => {
  try {
    const probe = '__resuelve_probe__';
    localStorage.setItem(probe,'1');
    localStorage.removeItem(probe);
    return localStorage;
  } catch (_) {
    const temporary = new Map();
    const ribbon = document.querySelector('.demo-ribbon span');
    if (ribbon) ribbon.textContent = 'DEMO TEMPORAL · Este navegador no permite almacenamiento local. Los pedidos desaparecerán al cerrar la página.';
    return {getItem:key=>temporary.has(key)?temporary.get(key):null,setItem:(key,value)=>temporary.set(key,String(value)),removeItem:key=>temporary.delete(key)};
  }
})();

function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
}
function getOrders() {
  try {
    const orders = JSON.parse(store.getItem(ORDERS_KEY) || '[]');
    return Array.isArray(orders) ? orders.filter(o => o && typeof o === 'object') : [];
  } catch (_) { return []; }
}
function saveOrders(orders) {
  try { store.setItem(ORDERS_KEY, JSON.stringify(orders)); return true; }
  catch (_) { window.alert('No se pueden guardar los datos en este navegador. Comprueba el almacenamiento local.'); return false; }
}
function seed() {
  // Nunca sobreescribir pedidos previos. Los dos registros iniciales son ficticios.
  if (store.getItem(ORDERS_KEY) !== null) return;
  saveOrders([
    {id:'R-DEMO-1042',service:'Redes y carteles',name:'Cafetería Ejemplo',email:'demo@resuelve.local',phone:'',brief:'Cartel ficticio para promocionar desayunos. Formato para redes sociales.',deadline:'',budget:'25–50 €',status:'Revisión',created:'Pedido de ejemplo',notes:'Ejemplo: comprobar textos y propuesta visual.'},
    {id:'R-DEMO-1041',service:'CV y empleo',name:'Persona Ejemplo',email:'demo@resuelve.local',phone:'',brief:'Ejemplo: actualización de CV y carta de presentación.',deadline:'',budget:'25–50 €',status:'En preparación',created:'Pedido de ejemplo',notes:''}
  ]);
}
function nav(page='home', opts={}) {
  if (!templates[page]) page = 'home';
  app.replaceChildren(templates[page].content.cloneNode(true));
  window.scrollTo(0, 0);
  bindContentNav();
  document.querySelectorAll('.nav-link').forEach(button => {
    button.setAttribute('aria-current', button.dataset.nav === page ? 'page' : 'false');
  });
  if (page === 'new') initForm(opts.service);
  if (page === 'track') initTrack();
  if (page === 'admin') initAdmin();
}
function bindContentNav() {
  app.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => nav(el.dataset.nav)));
  app.querySelectorAll('[data-service]').forEach(el => el.addEventListener('click', () => nav('new', {service:el.dataset.service})));
}
document.querySelectorAll('header [data-nav], .demo-ribbon [data-nav]').forEach(el => {
  el.addEventListener('click', e => { if (el.tagName === 'A') e.preventDefault(); nav(el.dataset.nav); });
});

function initForm(selected) {
  const form = document.getElementById('order-form');
  const service = form.elements.namedItem('service');
  if (selected && prices[selected]) service.value = selected;
  const quote = document.getElementById('quote-price');
  const update = () => { quote.textContent = prices[service.value] || 'Selecciona un servicio'; };
  service.addEventListener('change', update); update();
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form).entries());
    data.name = String(data.name || '').trim();
    data.email = String(data.email || '').trim().toLowerCase();
    data.brief = String(data.brief || '').trim();
    if (!data.name || !data.email || !data.brief || !prices[data.service]) {
      window.alert('Completa correctamente los datos necesarios del encargo de prueba.'); return;
    }
    const orders = getOrders();
    let id;
    do { id = `R-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,6).toUpperCase()}`; }
    while (orders.some(o => o.id === id));
    const order = {...data, id, status:'Solicitud recibida', created:new Date().toLocaleString('es-ES'), notes:''};
    if (!saveOrders([order,...orders])) return;
    try { store.setItem(EMAIL_KEY, data.email); } catch (_) { /* no afecta al pedido */ }
    app.innerHTML = `<section class="shell"><div class="success-card"><div class="check" aria-hidden="true">✓</div><p class="eyebrow">PEDIDO DE DEMOSTRACIÓN GUARDADO</p><h2>Así de sencillo.</h2><p>El pedido <strong>#${escapeHtml(id)}</strong> se ha guardado únicamente en este navegador. No se ha enviado a nadie.</p><div class="hero-actions centered"><button class="btn primary" id="go-track">Ver pedido</button><button class="btn ghost" id="go-home">Volver al inicio</button></div></div></section>`;
    document.getElementById('go-track').addEventListener('click', () => nav('track'));
    document.getElementById('go-home').addEventListener('click', () => nav('home'));
    window.scrollTo(0,0);
  });
}
function initTrack() {
  const email = document.getElementById('lookup-email');
  const btn = document.getElementById('lookup-btn');
  try { email.value = store.getItem(EMAIL_KEY) || 'demo@resuelve.local'; }
  catch (_) { email.value = 'demo@resuelve.local'; }
  const render = () => {
    const value = email.value.trim().toLowerCase();
    try { store.setItem(EMAIL_KEY, value); } catch (_) { /* funcional sin recordar email */ }
    const orders = getOrders().filter(o => String(o.email||'').toLowerCase() === value);
    const list = document.getElementById('orders-list');
    list.innerHTML = orders.length ? orders.map(o => `<article class="order-row"><div><span class="pill">${escapeHtml(o.status)}</span><h3>${escapeHtml(o.service)}</h3><p>#${escapeHtml(o.id)} · ${escapeHtml(o.created)}</p><p class="order-brief">${escapeHtml(o.brief)}</p></div><strong class="budget-label">${escapeHtml(o.budget)}</strong></article>`).join('') : '<div class="empty-state"><h3>No hay pedidos en este navegador</h3><p>Prueba con demo@resuelve.local para ver los ejemplos.</p></div>';
  };
  btn.addEventListener('click', render);
  email.addEventListener('keydown', e => { if (e.key === 'Enter') render(); });
  render();
}
function initAdmin() {
  let selectedId = null;
  const renderList = () => {
    const orders = getOrders();
    if (selectedId === null || !orders.some(o => o.id === selectedId)) selectedId = orders[0]?.id || null;
    document.getElementById('admin-stats').innerHTML = `<div class="stat"><b>${orders.length}</b><small>Total</small></div><div class="stat"><b>${orders.filter(o=>o.status !== 'Entregado').length}</b><small>Activos</small></div><div class="stat"><b>${orders.filter(o=>o.status === 'Entregado').length}</b><small>Entregados</small></div>`;
    document.getElementById('admin-list').innerHTML = orders.map(o => `<button type="button" class="admin-order ${o.id === selectedId?'selected':''}" data-id="${escapeHtml(o.id)}"><span class="pill">${escapeHtml(o.status)}</span><h3>${escapeHtml(o.service)}</h3><small>${escapeHtml(o.name)} · #${escapeHtml(o.id)}</small></button>`).join('');
    document.querySelectorAll('.admin-order').forEach(b => b.addEventListener('click', () => { selectedId = b.dataset.id; renderList(); renderDetail(); }));
    if (!orders.length) document.getElementById('admin-detail').innerHTML = '<div class="empty-state"><h3>No hay pedidos guardados</h3><p>Crea un encargo de prueba primero.</p></div>';
  };
  const renderDetail = () => {
    const o = getOrders().find(x=>x.id===selectedId); if (!o) return;
    document.getElementById('admin-detail').innerHTML = `<p class="eyebrow">PEDIDO DE PRUEBA #${escapeHtml(o.id)}</p><h2 class="admin-service-title">${escapeHtml(o.service)}</h2><div class="detail-grid"><div class="detail-box"><small>Cliente ficticio</small><strong>${escapeHtml(o.name)}</strong></div><div class="detail-box"><small>Contacto de prueba</small><strong>${escapeHtml(o.email)}</strong></div><div class="detail-box"><small>Entrega ideal</small><strong>${escapeHtml(o.deadline || 'Sin fecha')}</strong></div><div class="detail-box"><small>Presupuesto</small><strong>${escapeHtml(o.budget)}</strong></div></div><div class="brief-box"><small>DESCRIPCIÓN</small><p>${escapeHtml(o.brief)}</p></div><div class="admin-actions"><select id="status-select" aria-label="Estado del pedido">${statuses.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select><button type="button" class="btn primary" id="save-status">Actualizar estado</button></div><label class="note-area">Notas de demostración<textarea id="notes" rows="5" maxlength="3000" placeholder="Notas locales de prueba..."></textarea><button type="button" class="btn ghost" id="save-notes">Guardar notas</button></label><p id="admin-feedback" class="feedback" role="status" aria-live="polite"></p>`;
    document.getElementById('status-select').value = statuses.includes(o.status) ? o.status : statuses[0];
    document.getElementById('notes').value = String(o.notes || '');
    document.getElementById('save-status').addEventListener('click', () => updateOrder(o.id,{status:document.getElementById('status-select').value},'Estado guardado localmente.'));
    document.getElementById('save-notes').addEventListener('click', () => updateOrder(o.id,{notes:document.getElementById('notes').value},'Nota guardada localmente.'));
  };
  const updateOrder=(id,patch,message) => {
    const orders = getOrders().map(o => o.id === id ? {...o,...patch} : o);
    if (!saveOrders(orders)) return;
    renderList(); renderDetail();
    document.getElementById('admin-feedback').textContent = message;
  };
  renderList(); renderDetail();
}
seed();
nav('home');

</script>
</body>
</html>
